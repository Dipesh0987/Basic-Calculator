<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Calculator Layout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sora: ["Sora", "sans-serif"],
            },
            boxShadow: {
              panel: "0 35px 80px rgba(9, 12, 22, 0.45)",
              soft: "inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 22px rgba(0,0,0,0.25)",
              ember: "0 8px 24px rgba(255, 152, 25, 0.45)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-gradient-to-b from-slate-100 via-slate-200 to-slate-300 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 flex items-center justify-center p-6 font-sora transition-colors duration-500">
    <div class="pointer-events-none absolute inset-0 overflow-hidden">
      <div class="absolute -top-24 -left-24 h-72 w-72 rounded-full bg-cyan-200/30 blur-3xl dark:bg-cyan-500/10"></div>
      <div class="absolute bottom-0 right-0 h-80 w-80 rounded-full bg-orange-200/40 blur-3xl dark:bg-orange-500/15"></div>
    </div>
    <main class="relative w-[360px] max-w-full h-[760px] rounded-[46px] bg-gradient-to-br from-slate-200 via-slate-100 to-white dark:from-slate-800 dark:via-slate-900 dark:to-slate-950 text-slate-900 dark:text-white p-5 shadow-panel overflow-hidden transition-colors duration-500">
      <div class="pointer-events-none absolute inset-0 rounded-[46px] bg-[radial-gradient(circle_at_78%_90%,rgba(255,136,0,0.22),transparent_40%),radial-gradient(circle_at_10%_0%,rgba(148,163,184,0.16),transparent_45%)] dark:bg-[radial-gradient(circle_at_78%_90%,rgba(255,136,0,0.18),transparent_40%),radial-gradient(circle_at_10%_0%,rgba(148,163,184,0.18),transparent_45%)]"></div>
      <header class="flex items-start justify-between">
        <button class="relative z-10 h-14 w-14 rounded-2xl bg-gradient-to-b from-slate-300/80 to-slate-500/70 text-slate-700 dark:from-slate-500/60 dark:to-slate-700/70 dark:text-slate-100 shadow-soft transition-colors duration-500">🎤</button>
        <button id="themeToggle" class="relative z-10 h-10 px-4 rounded-xl bg-white/70 dark:bg-white/10 text-slate-700 dark:text-slate-100 border border-slate-300/60 dark:border-white/10 backdrop-blur-md shadow-soft transition-colors duration-500">
          <span id="themeIcon">☀️</span>
        </button>
      </header>

      <section class="relative z-10 mt-16 text-right">
        <p class="text-slate-500 dark:text-slate-400 text-[34px] leading-none tracking-tight transition-colors duration-500">4,900 + 15,910</p>
        <p class="text-[72px] font-light leading-[1.05] mt-2 tracking-tight">20,810</p>
      </section>

      <section class="relative z-10 mt-10 grid grid-cols-4 gap-3">
        <button class="h-20 rounded-[26px] bg-gradient-to-b from-slate-300/90 to-slate-500/80 text-[34px] dark:from-slate-500/80 dark:to-slate-700/80 shadow-soft transition-colors duration-500">C</button>
        <button class="h-20 rounded-[26px] bg-gradient-to-b from-slate-300/90 to-slate-500/80 text-[30px] dark:from-slate-500/80 dark:to-slate-700/80 shadow-soft transition-colors duration-500">+/-</button>
        <button class="h-20 rounded-[26px] bg-gradient-to-b from-slate-300/90 to-slate-500/80 text-[34px] dark:from-slate-500/80 dark:to-slate-700/80 shadow-soft transition-colors duration-500">%</button>
        <button class="h-20 rounded-[26px] bg-gradient-to-b from-amber-500 to-orange-500 text-[42px] shadow-ember">÷</button>

        <button class="h-20 rounded-[26px] bg-gradient-to-b from-slate-200/95 to-slate-400/90 text-[34px] dark:from-slate-700/90 dark:to-slate-900/90 shadow-soft transition-colors duration-500">7</button>
        <button class="h-20 rounded-[26px] bg-gradient-to-b from-slate-200/95 to-slate-400/90 text-[34px] dark:from-slate-700/90 dark:to-slate-900/90 shadow-soft transition-colors duration-500">8</button>
        <button class="h-20 rounded-[26px] bg-gradient-to-b from-slate-200/95 to-slate-400/90 text-[34px] dark:from-slate-700/90 dark:to-slate-900/90 shadow-soft transition-colors duration-500">9</button>
        <button class="h-20 rounded-[26px] bg-gradient-to-b from-amber-500 to-orange-500 text-[42px] shadow-ember">×</button>

        <button class="h-20 rounded-[26px] bg-gradient-to-b from-slate-200/95 to-slate-400/90 text-[34px] dark:from-slate-700/90 dark:to-slate-900/90 shadow-soft transition-colors duration-500">4</button>
        <button class="h-20 rounded-[26px] bg-gradient-to-b from-slate-200/95 to-slate-400/90 text-[34px] dark:from-slate-700/90 dark:to-slate-900/90 shadow-soft transition-colors duration-500">5</button>
        <button class="h-20 rounded-[26px] bg-gradient-to-b from-slate-200/95 to-slate-400/90 text-[34px] dark:from-slate-700/90 dark:to-slate-900/90 shadow-soft transition-colors duration-500">6</button>
        <button class="h-20 rounded-[26px] bg-gradient-to-b from-amber-500 to-orange-500 text-[42px] shadow-ember">−</button>

        <button class="h-20 rounded-[26px] bg-gradient-to-b from-slate-200/95 to-slate-400/90 text-[34px] dark:from-slate-700/90 dark:to-slate-900/90 shadow-soft transition-colors duration-500">1</button>
        <button class="h-20 rounded-[26px] bg-gradient-to-b from-slate-200/95 to-slate-400/90 text-[34px] dark:from-slate-700/90 dark:to-slate-900/90 shadow-soft transition-colors duration-500">2</button>
        <button class="h-20 rounded-[26px] bg-gradient-to-b from-slate-200/95 to-slate-400/90 text-[34px] dark:from-slate-700/90 dark:to-slate-900/90 shadow-soft transition-colors duration-500">3</button>
        <button class="h-20 rounded-[26px] bg-gradient-to-b from-amber-500 to-orange-500 text-[42px] shadow-ember">+</button>

        <button class="h-20 col-span-2 rounded-[26px] bg-gradient-to-r from-slate-200/95 to-slate-400/90 text-[34px] dark:from-slate-700/95 dark:to-slate-900/95 shadow-soft transition-colors duration-500">0</button>
        <button class="h-20 rounded-[26px] bg-gradient-to-b from-slate-300/90 to-slate-500/80 text-[42px] dark:from-slate-500/80 dark:to-slate-700/80 shadow-soft transition-colors duration-500">.</button>
        <button class="h-20 rounded-[26px] bg-gradient-to-b from-amber-500 to-orange-500 text-[42px] shadow-ember">=</button>
      </section>
    </main>

    <script>
      const root = document.documentElement;
      const toggle = document.getElementById("themeToggle");
      const themeIcon = document.getElementById("themeIcon");

      const applyTheme = (isDark) => {
        root.classList.toggle("dark", isDark);
        themeIcon.textContent = isDark ? "🌙" : "☀️";
      };

      const storedTheme = localStorage.getItem("calculator-theme");
      if (storedTheme) {
        applyTheme(storedTheme === "dark");
      }

      toggle.addEventListener("click", () => {
        const isDark = !root.classList.contains("dark");
        applyTheme(isDark);
        localStorage.setItem("calculator-theme", isDark ? "dark" : "light");
      });
    </script>
  </body>
</html>
